name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libffi-dev \
            libssl-dev \
            ant

      - name: Install Buildozer, Cython and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade cython==0.29.36 buildozer

      - name: Accept Android SDK licenses
        run: |
          # Garante que o diretório de configuração do android exista
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          
          # Se o buildozer já tiver baixado o sdk-manager, aceita as licenças de forma forçada
          ANDROID_SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          if [ -d "$ANDROID_SDK_DIR/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          fi

      - name: Build with Buildozer
        run: |
          buildozer -v android debug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk

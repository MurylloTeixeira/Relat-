name: Compilar APK Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar Repositório
      uses: actions/checkout@v4

    - name: Compilar APK com Buildozer Action
      uses: kivy/build-action@v1
      with:
        config: buildozer.spec
        command: android debug

    - name: Salvar APK gerado
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: bin/*.apk

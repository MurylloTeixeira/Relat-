name: Compilar APK Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar Repositório
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar Dependências do Sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            python3-pip \
            build-essential \
            git \
            python3-dev \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libgstreamer1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            unzip \
            zip \
            autoconf \
            libtool \
            pkg-config \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            openjdk-17-jdk \
            automake \
            libltdl-dev

    - name: Instalar Buildozer e Cython
      run: |
        pip install --upgrade pip
        pip install --upgrade cython==0.29.36
        pip install --upgrade buildozer

    - name: Limpar Cache e Builds Antigos
      run: |
        rm -rf .buildozer bin/
        find . -name "*.pyc" -delete

    - name: Compilar APK com Buildozer
      id: compile
      env:
        ACCEPT_SDK_LICENSES: "yes"
      run: |
        yes | buildozer -v android debug

    - name: Criar Relatório de Erro se Falhar
      if: failure()
      run: |
        mkdir -p bin
        echo "====================================================" > bin/ERRO_COMPILACAO.txt
        echo "          RELATÓRIO DE FALHA NO BUILD - RELATÔ+     " >> bin/ERRO_COMPILACAO.txt
        echo "====================================================" >> bin/ERRO_COMPILACAO.txt
        echo "Ocorreu um erro no comando de compilação do Buildozer." >> bin/ERRO_COMPILACAO.txt
        echo "Causa provável: Incompatibilidade de compilação em C (Clang/NDK) ao processar módulos gráficos do Kivy (svg.o)." >> bin/ERRO_COMPILACAO.txt
        echo "Data/Hora: $(date)" >> bin/ERRO_COMPILACAO.txt
        echo "----------------------------------------------------" >> bin/ERRO_COMPILACAO.txt
        echo "Dica de correção: Tente fixar a versão do Kivy ou remover dependências gráficas avançadas no buildozer.spec." >> bin/ERRO_COMPILACAO.txt

    - name: Salvar Artefactos (APK ou Relatório de Erro)
      uses: actions/upload-artifact@v4
      with:
        name: resultado-compilacao
        path: |
          bin/*.apk
          bin/ERRO_COMPILACAO.txt
